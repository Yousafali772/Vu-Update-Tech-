<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/img/logo.jpeg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>show and hide password</title>
    <style>
        .password-container {
            position: relative;
            width: 250px;
        }

        .password-input {
            width: 100%;
            padding: 10px;
        }

        .toggle-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="password-container">
        <input type="password" id="password" class="password-input" placeholder="Enter Password">
        <button type="button" class="toggle-btn" onclick="togglePassword()"><i class="fa-regular fa-eye"></i></button>
    </div>
    <script>
        function togglePassword() {
            const passwordField = document.getElementById("password");
            const toggleBtn = document.querySelector(".toggle-btn");

            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleBtn.textContent = "fa-eye-slash";
            } else {
                passwordField.type = "password";
                toggleBtn.textContent = "fa-eye";
            }
        }
    </script>
    <script src="/assets/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
